# Direction 1 reduced-order mechanism prototype.
# Every numerical value below is a SYNTHETIC / NON-PHYSICAL DEFAULT.
# These values do not describe a real PV system, experiment, or 45 m structure.
data_classification: MECHANISM_PROTOTYPE
parameter_status: SYNTHETIC / NON-PHYSICAL DEFAULT

coordinates:
  order: [z, theta]
  units: [arbitrary_displacement, arbitrary_rotation]

dynamics:
  mass_matrix:
    - [1.0, 0.0]
    - [0.0, 0.20]
  linear_stiffness_matrix:
    - [160.0, 3.0]
    - [3.0, 72.0]
  damping_ratio: 0.02
  # To use a direct damping matrix, add damping_matrix and remove damping_ratio.

geometric_nonlinearity:
  cubic_z: 300.0
  cubic_theta: 25.0
  cubic_coupling: 80.0
  quadratic_coupling: 10.0

tension_surrogate:
  tension_only: true
  direction: [1.0, 0.20]
  stiffness: 15.0
  low_tension_stiffness_ratio: 0.10
  pretension: 0.10
  low_tension_threshold: 0.05

forcing:
  type: harmonic
  amplitudes: [1.0, 0.08]
  frequency_hz: 1.20
  phases_deg: [0.0, 0.0]
  # Used only when type is broadband_synthetic. This is a deterministic sum of sines.
  broadband_components:
    - frequency_hz: 0.8
      amplitudes: [0.35, 0.02]
      phases_deg: [0.0, 30.0]
    - frequency_hz: 1.7
      amplitudes: [0.20, 0.03]
      phases_deg: [45.0, 0.0]

initial_conditions:
  displacement: [0.0, 0.0]
  velocity: [0.0, 0.0]

solver:
  method: RK45
  duration_seconds: 8.0
  sampling_frequency_hz: 100.0
  max_step_seconds: 0.005
  relative_tolerance: 1.0e-7
  absolute_tolerance: 1.0e-9
  max_runtime_seconds: 300.0

analysis:
  fundamental_frequency_hz: 1.20
